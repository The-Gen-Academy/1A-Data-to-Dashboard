[project]
name = "stock-analyst-agent"
version = "0.1.0"
description = "AI-powered Streamlit app for US stock transaction uploads, FIFO holdings, portfolio performance, and Groq analysis."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "groq>=0.31.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "plotly>=6.2.0",
    "python-dotenv>=1.1.0",
    "scipy>=1.16.0",
    "streamlit>=1.48.0",
    "yfinance>=0.2.65",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
